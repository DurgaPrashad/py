[package]
name = "reflex-presenter"
version = "0.5.2"
description = "Local-first AI presentation teleprompter"
authors = ["Reflex Presenter"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "reflex_presenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
cpal = "0.18.2"
zip = "8.6.0"
quick-xml = "0.42.0"
cfb = "0.15.0"
ureq = "3.4.2"
uuid = { version = "1.27.0", features = ["v4"] }
anyhow = "1.0.104"
parking_lot = "0.12.5"

# GPU acceleration for whisper.cpp: Metal on macOS; CPU elsewhere by default
# (enable whisper-rs "cuda" / "vulkan" features for GPU builds there).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSResponder", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"
